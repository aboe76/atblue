---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: atblue
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx-nvidia-open
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /
      - source: keys
        destination: /tmp/keys
      - source: rpms
        destination: /tmp/rpms
      - source: prebuilt-modules
        destination: /tmp/prebuilt-modules

  - type: dnf
    repos:
      copr:
        - dsommers/openvpn3-devsnapshots
      files:
      - https://repo.vivaldi.com/stable/vivaldi-fedora.repo
      keys:
      - https://packages.omnissa.com/horizon/keys/OMNISSA-PACKAGING-GPG-RSA-KEY.pub
      - https://repo.vivaldi.com/archive/linux_signing_key.pub
    install:
      skip-unavailable: true # skip unavailable packages
      packages:
        - openh264
        - mozilla-openh264
        - nss-tools
        - freerdp
        - vivaldi-stable
        - openvpn3-client
        - kmod-ovpn-dco

  - type: script
    scripts:
      - set_fix_blurry_wayland_apps.sh
      - set_ssh_unprivileged_ports.sh

  - type: systemd
    system:
      enabled:
        - enable_tuntap_device.service
        - openvpn3-init-config.service
        - openvpn3-selinux-workaround.service

#  - type: rpm-ostree
#    install:
#      - https://github.com/displaylink-rpm/displaylink-rpm/releases/download/v6.2.0/fedora-42-displaylink-1.14.15-1.github_evdi.x86_64.rpm

# - type: displaylinkrpm
#   source: local
#   options:
#     rpm_package: /tmp/rpms/fedora-43-displaylink-1.14.15-1.github_evdi.x86_64.rpm
#     git_repo: https://github.com/displaylink-rpm/displaylink-rpm.git
#     cleanup_build_deps: true

  - type: displaylink
    source: local
    options:
      rpm_package: /tmp/rpms/fedora-44-displaylink-1.14.16-2.github_evdi.x86_64.rpm
      signing_keys_dir: /tmp/keys
      evdi_git_repo: https://github.com/DisplayLink/evdi.git
      cleanup_build_deps: true

  #- type: default-flatpaks
  #  configurations:
  #    - notify: true # Send notification after install/uninstall is finished (true/false)
  #      scope: system
  #      # If no repo information is specified, Flathub will be used by default
  #      install:  [] # system flatpaks we want all users to have and not remove
  #      #  - org.mozilla.firefox
  #      #  - org.gnome.Loupe
  #    - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
