name: displaylinkrpm
description: Install DisplayLink rpm
author: local
version: 1.0.0

# Module type
type: script

# Default configuration
defaultOptions:
  rpm_package: "/tmp/rpms/displaylink-1.14.11-1.x86_64.rpm"
  git_repo: "https://github.com/displaylink-rpm/displaylink-rpm.git"
  cleanup_build_deps: true

# Required options schema
options:
  git_repo:
    type: string
    description: EVDI Git repository URL
    required: false
  cleanup_build_deps:
    type: boolean
    description: Whether to clean up build dependencies after installation
    required: false
